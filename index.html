<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <script src="coi-serviceworker.js"></script>
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">

    <title>kisakcod webport</title>

    <style>
        @font-face {
            font-family: "Conduit ITC";
            src: url("assets/conduit-itc-regular.otf") format("opentype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Conduit ITC", sans-serif;
            font-size: 18px;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            object-fit: fill;
            cursor: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #installer-panel {
            position: absolute;
            inset: 0;
            background: rgba(16, 11, 20, .96);
            color: #d8d8d8;
            z-index: 3;
            overflow: auto;
            padding: 36px 40px 56px;
            box-sizing: border-box;
            text-align: center;
        }

        #installer-panel h1 {
            margin: 0 0 12px;
            font-size: 32px;
            color: #fff;
            letter-spacing: .06em;
        }

        #installer-panel p.hint {
            color: #9aa;
            max-width: 52em;
            font-size: 18px;
            line-height: 1.45;
            margin: 0 auto 24px;
        }

        #installer-panel button {
            background: #6ec26e;
            color: #183318;
            border: none;
            padding: 9px 13px;
            margin: 6px;
            font-size: 18px;
            border-radius: 2px;
            cursor: pointer;
            font-family: inherit;
        }

        #installer-panel button:disabled {
            opacity: .4;
            cursor: default;
        }

        #installer-panel button.danger {
            background: #3a1c1c;
            color: #fcc;
        }

        #installer-panel button.secondary {
            background: #333;
            color: #ddd;
        }

        #installer-panel .row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px auto;
        }

        #install-options {
            max-width: 900px;
            margin: 0 auto;
        }

        #install-options[hidden] {
            display: none;
        }

        #install-copy-size {
            color: #aaa;
            font-size: 16px;
            margin: 12px auto;
        }

        #progress-wrap {
            max-width: 760px;
            margin: 22px auto 0;
        }

        #progress-bar {
            width: 100%;
            height: 22px;
            background: #222;
            border: 1px solid #444;
            box-sizing: border-box;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #6ec26e;
            transition: width .08s linear;
        }

        #progress-text {
            margin-top: 8px;
            color: #aaa;
            font-size: 16px;
            min-height: 20px;
        }

        #download-status {
            margin-top: 14px;
            color: #ddd;
            font-size: 18px;
            min-height: 22px;
        }

        #download-detail {
            margin-top: 5px;
            color: #888;
            font-size: 14px;
            min-height: 18px;
        }

        #status {
            color: #ddd;
            margin-top: 10px;
            min-height: 22px;
        }

        #install-log {
            white-space: pre-wrap;
            font-size: 14px;
            color: #9a9;
            margin: 16px auto 0;
            max-width: 68em;
            max-height: 260px;
            overflow: auto;
            text-align: left;
        }

        .small {
            color: #777;
            font-size: 14px;
        }

        #fullscreen-button {
            display: none;
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 5;
            background: #6ec26e;
            color: #183318;
            border: none;
            border-radius: 2px;
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 18px;
        }

        #version-tag {
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 6;
            text-align: left;
            color: #ddd;
            font-family: "Conduit ITC", sans-serif;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
            pointer-events: none;
            user-select: none;
        }

        #version-tag .version-line {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            letter-spacing: .04em;
        }

        #version-tag .credit-line {
            font-size: 15px;
            color: #bbb;
            margin-top: 3px;
        }

        body.game-running:not(.is-fullscreen) #fullscreen-button {
            display: block;
        }

        body.game-running #installer-panel {
            display: none !important;
        }

        #game-console {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 4;
            max-height: 10vh;
            overflow-y: auto;
            margin: 0;
            padding: 3px 8px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, .55);
            color: #8fdc8f;
            font-family: "Courier New", monospace;
            font-size: 10px;
            line-height: 1.25;
            white-space: pre-wrap;
            pointer-events: auto;
            overscroll-behavior: contain;
            text-shadow: 0 1px 1px rgba(0, 0, 0, .8);
        }

        #game-console:empty {
            display: none;
        }

        #game-console .err { color: #ff8080; }
        #game-console .warn { color: #ffd480; }

        body.is-fullscreen #game-console {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="version-tag">
        <div class="version-line">Version 1.0</div>
        <div class="credit-line">Made by: ricefarmer/Viet guy but yeah</div>
        <div class="credit-line">Web port by: slqnt</div>
    </div>

    <div id="installer-panel">
        <h1>KisakCOD</h1>
        <p class="hint">
            Install the game files from the split ZIP archive.
            The archive is processed piece-by-piece and extracted directly
            into browser storage.
        </p>

        <div class="row">
            <button id="install-button" type="button">Install Game</button>
            <button id="play-button" type="button" disabled>Play</button>
            <button id="wipe-data-button" type="button" class="danger">Wipe data</button>
            <button id="download-save-button" type="button">Download save data</button>
            <button id="upload-save-button" type="button">Upload save data</button>
            <input id="upload-save-input" type="file" accept=".dat,.zip" hidden>
        </div>

        <div id="install-options" hidden>
            <div class="row">
                <label><input id="include-audio" type="checkbox" checked> Audio</label>
                <label><input id="include-video" type="checkbox"> Video</label>
                <label><input id="exclude-campaign" type="checkbox"> Disable campaign maps</label>
            </div>
            <div id="install-copy-size"></div>
            <div id="progress-wrap">
                <div id="progress-bar"><div id="progress-fill"></div></div>
                <div id="progress-text">Waiting...</div>
                <div id="download-status"></div>
                <div id="download-detail"></div>
            </div>
        </div>

        <div id="status"></div>
        <div id="install-log"></div>
        <div class="small">Game data is stored locally using Origin Private File System.</div>
    </div>

    <canvas id="canvas" tabindex="-1" width="1280" height="720"></canvas>
    <button id="fullscreen-button" type="button">Fullscreen</button>
    <div id="game-console" aria-live="polite"></div>

    <script>
        "use strict";

        const canvas = document.getElementById("canvas");
        const fullscreenButton = document.getElementById("fullscreen-button");
        const installerPanel = document.getElementById("installer-panel");
        const installButton = document.getElementById("install-button");
        const playButton = document.getElementById("play-button");
        const wipeButton = document.getElementById("wipe-data-button");
        const downloadSaveButton = document.getElementById("download-save-button");
        const uploadSaveButton = document.getElementById("upload-save-button");
        const uploadSaveInput = document.getElementById("upload-save-input");
        const installOptions = document.getElementById("install-options");
        const includeAudio = document.getElementById("include-audio");
        const includeVideo = document.getElementById("include-video");
        const excludeCampaign = document.getElementById("exclude-campaign");
        const installCopySize = document.getElementById("install-copy-size");
        const progressFill = document.getElementById("progress-fill");
        const progressText = document.getElementById("progress-text");
        const downloadStatus = document.getElementById("download-status");
        const downloadDetail = document.getElementById("download-detail");
        const statusElement = document.getElementById("status");
        const installLog = document.getElementById("install-log");
        const gameConsole = document.getElementById("game-console");

        function consoleWrite(message, isError, isWarn) {
            const nearBottom = gameConsole.scrollHeight - gameConsole.scrollTop - gameConsole.clientHeight < 24;
            const line = document.createElement("div");
            if (isError) line.className = "err";
            else if (isWarn) line.className = "warn";
            line.textContent = message;
            gameConsole.appendChild(line);
            while (gameConsole.childNodes.length > 200) {
                gameConsole.removeChild(gameConsole.firstChild);
            }
            if (nearBottom) gameConsole.scrollTop = gameConsole.scrollHeight;
        }

        function formatConsoleArgs(args) {
            return Array.from(args).map(arg => {
                if (typeof arg === "string") return arg;
                if (arg instanceof Error) return arg.stack || arg.message;
                try { return JSON.stringify(arg); } catch { return String(arg); }
            }).join(" ");
        }

        (function mirrorDevToolsConsole() {
            const original = {
                log: console.log.bind(console),
                info: console.info.bind(console),
                warn: console.warn.bind(console),
                error: console.error.bind(console)
            };
            console.log = (...args) => { original.log(...args); consoleWrite(formatConsoleArgs(args)); };
            console.info = (...args) => { original.info(...args); consoleWrite(formatConsoleArgs(args)); };
            console.warn = (...args) => { original.warn(...args); consoleWrite(formatConsoleArgs(args), false, true); };
            console.error = (...args) => { original.error(...args); consoleWrite(formatConsoleArgs(args), true); };
        })();

        function log(message) {
            installLog.textContent += message + "\n";
            installLog.scrollTop = installLog.scrollHeight;
            consoleWrite(message);
        }

        window.addEventListener("error", event => {
            // Ignore external extension errors that don't belong to the app
            if (event.filename && !event.filename.includes(location.origin)) return;
            consoleWrite("ERROR: " + (event.error?.stack || event.error?.message || event.message), true);
        });

        window.addEventListener("unhandledrejection", event => {
            consoleWrite("ERROR: " + (event.reason?.stack || event.reason?.message || event.reason), true);
        });

        function status(message) { statusElement.textContent = message; }

        function setProgress(value, text) {
            value = Math.max(0, Math.min(1, value));
            progressFill.style.width = (value * 100).toFixed(2) + "%";
            if (text !== undefined) progressText.textContent = text;
        }

        function setDownloadUI(main, detail) {
            downloadStatus.textContent = main || "";
            downloadDetail.textContent = detail || "";
        }

        /* Fullscreen & Keyboard lock */
        fullscreenButton.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
                try { await navigator.keyboard?.lock?.(); } catch { }
            } catch { }
        });

        document.addEventListener("fullscreenchange", () => {
            const fullscreen = !!document.fullscreenElement;
            document.body.classList.toggle("is-fullscreen", fullscreen);
            if (fullscreen) { try { navigator.keyboard?.lock?.().catch(() => { }); } catch { } }
            resizeGameCanvas();
        });

        function resizeGameCanvas() {
            canvas.style.left = "0";
            canvas.style.top = "0";
            canvas.style.transform = "none";
            canvas.style.width = "100vw";
            canvas.style.height = "100vh";
            if (window.visualViewport) {
                canvas.style.width = "100dvw";
                canvas.style.height = "100dvh";
            }
        }
        window.addEventListener("resize", resizeGameCanvas, { passive: true });
        resizeGameCanvas();

        /* Emscripten Module Config */
        var Module = {
            canvas: canvas,
            locateFile: path => path + "?v=creditsmute1",
            kisakLanUrl: ("https:" === location.protocol ? "wss://" : "ws://") + location.host + "/lan",
            print: console.log,
            printErr: console.log,
            setStatus() { },
            onAbort: message => {
                console.log("abort: " + message);
                status("Game aborted: " + message);
            }
        };

        /* Input Bridge */
        let inputInstalled = false;
        window.__kisakInstallInput = function () {
            var base = 0 | Module.kisakInputBase;
            if (!base || inputInstalled) return;
            inputInstalled = true;
            canvas.style.cursor = "default";
            let mouseDown = false;
            var wantLockOff = Module.kisakWantLockOff >> 2;

            function getHeap32() {
                if (Module.HEAP32) return Module.HEAP32;
                var memory = Module.wasmMemory;
                if (memory && memory.buffer) return new Int32Array(memory.buffer);
                throw new Error("no HEAP32/wasmMemory");
            }

            var lastX = 0, lastY = 0, hasMousePosition = false;

            function updateMouse(event, isButtonEvent) {
                var heap = getHeap32();
                var base32 = base >> 2;
                if (document.pointerLockElement === canvas) {
                    if (isButtonEvent) return;
                    var dx = 0 | event.movementX, dy = 0 | event.movementY;
                    if (dx > 80) dx = 80; else if (dx < -80) dx = -80;
                    if (dy > 80) dy = 80; else if (dy < -80) dy = -80;
                    heap[base32 + 2] += dx;
                    heap[base32 + 3] += dy;
                    return;
                }
                var rect = canvas.getBoundingClientRect();
                var width = rect.width || 1, height = rect.height || 1;
                var nx = (event.clientX - rect.left) / width;
                var ny = (event.clientY - rect.top) / height;
                if (nx < 0) nx = 0; if (ny < 0) ny = 0;
                if (nx > 1) nx = 1; if (ny > 1) ny = 1;
                var logicalWidth = 0 | heap[base32 + 6];
                var logicalHeight = 0 | heap[base32 + 7];
                if (logicalWidth < 64) logicalWidth = 1280;
                if (logicalHeight < 64) logicalHeight = 720;
                var x = nx * logicalWidth | 0;
                var y = ny * logicalHeight | 0;
                heap[base32] = x;
                heap[base32 + 1] = y;
                if (!isButtonEvent && hasMousePosition) {
                    heap[base32 + 2] += x - lastX;
                    heap[base32 + 3] += y - lastY;
                }
                lastX = x; lastY = y;
                hasMousePosition = true;
            }

            function getWantLock() {
                return 0 | getHeap32()[(base >> 2) + wantLockOff];
            }

            function updateCursor() {
                var wantLock = getWantLock();
                canvas.style.cursor = wantLock ? "none" : "default";
                if (!wantLock && document.pointerLockElement === canvas) {
                    try { document.exitPointerLock(); } catch { }
                }
            }

            function pushKeyEvent(type, keyCode, character) {
                var heap = getHeap32();
                var base32 = base >> 2;
                var queueState = heap[base32 + 8] >>> 0;
                var index = queueState & 63;
                heap[base32 + 10 + index] = type;
                heap[base32 + 10 + 64 + index] = keyCode;
                heap[base32 + 10 + 128 + index] = character;
                heap[base32 + 8] = queueState + 1;
            }

            canvas.addEventListener("mousemove", e => { updateCursor(); updateMouse(e, false); });
            canvas.addEventListener("mousedown", e => {
                mouseDown = true;
                try { canvas.focus(); } catch { }
                updateCursor();
                if (getWantLock() && document.pointerLockElement !== canvas) {
                    try { var p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch { }
                }
                updateMouse(e, true);
                getHeap32()[4 + (base >> 2)] = 0 | e.buttons;
                pushKeyEvent(1, 256 + (0 | e.button), 0);
                e.preventDefault();
            });

            canvas.addEventListener("mouseup", e => {
                updateMouse(e, true);
                getHeap32()[4 + (base >> 2)] = 0 | e.buttons;
                pushKeyEvent(0, 256 + (0 | e.button), 0);
                e.preventDefault();
            });

            document.addEventListener("pointerlockchange", () => {
                var heap = getHeap32(), base32 = base >> 2;
                heap[base32 + 2] = 0; heap[base32 + 3] = 0;
                hasMousePosition = false;
            });

            canvas.addEventListener("wheel", e => {
                getHeap32()[5 + (base >> 2)] += e.deltaY > 0 ? 1 : e.deltaY < 0 ? -1 : 0;
                e.preventDefault();
            }, { passive: false });

            window.addEventListener("keydown", e => {
                if (mouseDown && e.key !== "F12") {
                    var ch = e.key && e.key.length === 1 ? e.key.charCodeAt(0) : 0;
                    pushKeyEvent(1, 0 | e.keyCode, ch);
                    if (e.key === "Tab" || e.key === " " || e.key.indexOf("Arrow") === 0 || e.key === "Backspace") {
                        e.preventDefault();
                    }
                }
            });

            window.addEventListener("keyup", e => {
                if (mouseDown) pushKeyEvent(0, 0 | e.keyCode, 0);
            });

            window.addEventListener("mousedown", e => {
                if (e.target !== canvas) mouseDown = false;
            }, true);

            updateCursor();
            setInterval(updateCursor, 100);
        };

        const PART_COUNT = 329;
        const PART_PREFIX = "https://raw.githubusercontent.com/linkawaken1979-alt/kisakcod/main/game-files/cod4-modern-warfare.zip.part";
        const PART_DIGITS = 3;

        class SplitZipReader {
            constructor(partCount, prefix = PART_PREFIX) {
                this.partCount = partCount;
                this.prefix = prefix;
                this.offsets = new Array(partCount + 1);
                this.offsets[0] = 0;
                this.totalSize = 0;
                this.partCache = new Map();
                this.partLoads = new Map();
                this.bytesDownloaded = 0;
            }

            partUrl(index) {
                if (!Number.isInteger(index) || index < 0 || index >= this.partCount) {
                    throw new RangeError("Invalid archive part: " + index);
                }
                return this.prefix + String(index + 1).padStart(PART_DIGITS, "0");
            }

            async getPartSize(index) {
                const url = this.partUrl(index);
                try {
                    const head = await fetch(url, { method: "HEAD", cache: "no-store" });
                    if (head.ok) {
                        const len = Number(head.headers.get("content-length"));
                        if (Number.isSafeInteger(len) && len > 0) return len;
                    }
                } catch { }

                const response = await fetch(url, { cache: "no-store" });
                if (!response.ok) throw new Error(`Could not check archive part ${index + 1}: HTTP ${response.status}`);
                if (!response.body) throw new Error(`Archive part ${index + 1} has no readable body.`);
                const reader = response.body.getReader();
                let size = 0;
                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) size += value.byteLength;
                    }
                } finally {
                    try { reader.releaseLock(); } catch { }
                }
                return size;
            }

            async initialize() {
                let total = 0;
                this.offsets[0] = 0;
                for (let i = 0; i < this.partCount; i++) {
                    const partNumber = i + 1;
                    setProgress((i / this.partCount) * 0.12, `Checking COD4 part ${partNumber} / ${this.partCount}`);
                    setDownloadUI(`Checking COD4 part ${partNumber} / ${this.partCount}`, "Reading archive metadata...");
                    const size = await this.getPartSize(i);
                    total += size;
                    this.offsets[i + 1] = total;
                }
                this.totalSize = total;
                setProgress(0.12, "Archive metadata ready.");
                setDownloadUI("Archive metadata ready.", `${this.partCount} parts • ${formatBytes(this.totalSize)} total`);
            }

            findPart(position) {
                let low = 0, high = this.partCount - 1;
                while (low <= high) {
                    const middle = (low + high) >> 1;
                    if (position >= this.offsets[middle] && position < this.offsets[middle + 1]) return middle;
                    if (position < this.offsets[middle]) high = middle - 1;
                    else low = middle + 1;
                }
                throw new Error("Could not locate archive part.");
            }

            async _downloadPart(index, background = false) {
                const url = this.partUrl(index);
                const response = await fetch(url, { cache: "force-cache" });
                if (!response.ok) throw new Error(`Failed to download COD4 part ${index + 1}: HTTP ${response.status}`);
                
                let buffer;
                if (response.body) {
                    const reader = response.body.getReader();
                    const chunks = [];
                    let totalLoaded = 0;
                    const expected = Number(response.headers.get("content-length"));
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value && value.byteLength) {
                            chunks.push(value);
                            totalLoaded += value.byteLength;
                            if (!background) {
                                const partFraction = expected > 0 ? totalLoaded / expected : totalLoaded / Math.max(1, this.offsets[index + 1] - this.offsets[index]);
                                const overall = (index + Math.min(1, partFraction)) / this.partCount;
                                setProgress(0.12 + overall * 0.48, `Downloading COD4 part ${index + 1} / ${this.partCount}`);
                                setDownloadUI(`Downloading COD4 part ${index + 1} / ${this.partCount}`, `${formatBytes(totalLoaded)}${expected > 0 ? " / " + formatBytes(expected) : ""}`);
                            }
                        }
                    }
                    buffer = new Uint8Array(totalLoaded);
                    let position = 0;
                    for (const chunk of chunks) {
                        buffer.set(chunk, position);
                        position += chunk.byteLength;
                    }
                } else {
                    buffer = new Uint8Array(await response.arrayBuffer());
                }

                this.bytesDownloaded += buffer.byteLength;
                this.partCache.set(index, buffer);
                if (this.partCache.size > 2) {
                    const oldest = [...this.partCache.keys()].sort((a, b) => a - b)[0];
                    if (oldest !== index) this.partCache.delete(oldest);
                }
                return buffer;
            }

            async loadPart(index, background = false) {
                const cached = this.partCache.get(index);
                if (cached) return cached;
                let promise = this.partLoads.get(index);
                if (!promise) {
                    promise = this._downloadPart(index, background);
                    this.partLoads.set(index, promise);
                    promise.then(() => this.partLoads.delete(index), () => this.partLoads.delete(index));
                }
                return promise;
            }

            prefetchPart(index) {
                if (index < 0 || index >= this.partCount) return;
                if (this.partCache.has(index) || this.partLoads.has(index)) return;
                this.loadPart(index, true).catch(() => {});
            }

            async read(position, length) {
                if (length === 0) return new Uint8Array(0);
                const output = new Uint8Array(length);
                let current = position, remaining = length, outputOffset = 0;
                while (remaining > 0) {
                    const part = this.findPart(current);
                    const buffer = await this.loadPart(part);
                    this.prefetchPart(part + 1);
                    const inside = current - this.offsets[part];
                    const available = buffer.length - inside;
                    const amount = Math.min(remaining, available);
                    output.set(buffer.subarray(inside, inside + amount), outputOffset);
                    current += amount;
                    outputOffset += amount;
                    remaining -= amount;
                }
                return output;
            }

            async stream(position, length) {
                if (length === 0) return new ReadableStream({ start(c) { c.close(); } });
                const reader = this;
                let current = position, remaining = length;
                const CHUNK_SIZE = 8 * 1024 * 1024;
                return new ReadableStream({
                    async pull(controller) {
                        if (remaining <= 0) { controller.close(); return; }
                        const amount = Math.min(CHUNK_SIZE, remaining);
                        try {
                            const chunk = await reader.read(current, amount);
                            current += amount;
                            remaining -= amount;
                            controller.enqueue(chunk);
                            if (remaining <= 0) controller.close();
                        } catch (err) {
                            controller.error(err);
                        }
                    }
                });
            }
        }

        function u16(b, o) { return (b[o] | (b[o + 1] << 8)) >>> 0; }
        function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }
        function u64(b, o) {
            let v = 0n;
            for (let i = 7; i >= 0; i--) v = (v << 8n) | BigInt(b[o + i]);
            return v;
        }
        function decodeUTF8(bytes) { return new TextDecoder("utf-8").decode(bytes); }

        function findSignature(buffer, signature) {
            for (let i = buffer.length - 4; i >= 0; i--) {
                if (u32(buffer, i) === signature) return i;
            }
            return -1;
        }

        async function readZipDirectory(zip) {
            status("Reading ZIP directory...");
            setProgress(0.61, "Reading ZIP directory...");
            setDownloadUI("Reading ZIP directory...", "Finding ZIP64 central directory...");
            const tailSize = Math.min(zip.totalSize, 65557 + 22);
            const tail = await zip.read(zip.totalSize - tailSize, tailSize);
            const eocd = findSignature(tail, 0x06054b50);
            if (eocd < 0) throw new Error("ZIP end-of-central-directory record not found.");

            let entries = u16(tail, eocd + 10);
            let directorySize = u32(tail, eocd + 12);
            let directoryOffset = u32(tail, eocd + 16);

            if (entries === 0xffff || directorySize === 0xffffffff || directoryOffset === 0xffffffff) {
                const locator = findSignature(tail.subarray(0, eocd), 0x07064b50);
                if (locator < 0) throw new Error("ZIP64 locator is missing.");
                const zip64Offset = u64(tail, locator + 8);
                const record = await zip.read(Number(zip64Offset), 56);
                entries = Number(u64(record, 32));
                directorySize = Number(u64(record, 40));
                directoryOffset = Number(u64(record, 48));
            }

            log("ZIP entries: " + entries);
            const directory = await zip.read(directoryOffset, directorySize);
            const result = [];
            let offset = 0;

            for (let i = 0; i < entries; i++) {
                if (u32(directory, offset) !== 0x02014b50) throw new Error("Invalid central directory entry at " + i);
                const flags = u16(directory, offset + 8);
                const method = u16(directory, offset + 10);
                let compressedSize = u32(directory, offset + 20);
                let uncompressedSize = u32(directory, offset + 24);
                const nameLength = u16(directory, offset + 28);
                const extraLength = u16(directory, offset + 30);
                const commentLength = u16(directory, offset + 32);
                let localOffset = u32(directory, offset + 42);
                const externalAttributes = u32(directory, offset + 38);
                const name = decodeUTF8(directory.subarray(offset + 46, offset + 46 + nameLength));
                const extraStart = offset + 46 + nameLength;
                const extra = directory.subarray(extraStart, extraStart + extraLength);

                if (compressedSize === 0xffffffff || uncompressedSize === 0xffffffff || localOffset === 0xffffffff) {
                    let p = 0;
                    while (p + 4 <= extra.length) {
                        const id = u16(extra, p);
                        const size = u16(extra, p + 2);
                        if (id === 0x0001) {
                            let q = p + 4;
                            if (uncompressedSize === 0xffffffff) { uncompressedSize = Number(u64(extra, q)); q += 8; }
                            if (compressedSize === 0xffffffff) { compressedSize = Number(u64(extra, q)); q += 8; }
                            if (localOffset === 0xffffffff) { localOffset = Number(u64(extra, q)); }
                            break;
                        }
                        p += 4 + size;
                    }
                }

                const directoryEntry = name.endsWith("/") || ((externalAttributes & 0x10) !== 0);
                result.push({
                    name, flags, method, compressedSize, uncompressedSize, localOffset, externalAttributes, directory: directoryEntry
                });
                offset += 46 + nameLength + extraLength + commentLength;
            }

            const topLevelCandidates = new Set();
            for (const entry of result) {
                const norm = normalizeZipPath(entry.name);
                if (!norm) continue;
                const slash = norm.indexOf("/");
                if (slash > 0) topLevelCandidates.add(norm.slice(0, slash));
                else if (!entry.directory) topLevelCandidates.add("");
            }
            const wrapper = (topLevelCandidates.size === 1 && !topLevelCandidates.has("")) ? [...topLevelCandidates][0] : "";
            if (wrapper) {
                log("Archive root folder detected: " + wrapper);
                log("Game files will be extracted directly into /cod4.");
            }
            for (const entry of result) entry.archiveRoot = wrapper;

            setProgress(0.65, "ZIP directory loaded.");
            setDownloadUI("ZIP directory loaded.", `${entries.toLocaleString()} entries found`);
            return result;
        }

        function normalizeZipPath(name) {
            name = name.replaceAll("\\", "/");
            while (name.startsWith("/")) name = name.slice(1);
            const parts = name.split("/");
            const safe = [];
            for (const part of parts) {
                if (!part || part === ".") continue;
                if (part === "..") throw new Error("Unsafe ZIP path: " + name);
                safe.push(part);
            }
            return safe.join("/");
        }

        function getGamePath(entry) {
            let path = normalizeZipPath(entry.name);
            const wrapper = entry.archiveRoot || "";
            if (wrapper) {
                const prefix = wrapper + "/";
                if (path === wrapper) return "";
                if (path.startsWith(prefix)) path = path.slice(prefix.length);
            }
            return normalizeZipPath(path);
        }

        async function getOPFSRoot() {
            if (!navigator.storage || !navigator.storage.getDirectory) {
                throw new Error("This browser does not support Origin Private File System.");
            }
            return navigator.storage.getDirectory();
        }

        async function getFreshCod4Directory() {
            const root = await getOPFSRoot();
            try { await root.removeEntry("cod4", { recursive: true }); } catch { }
            return await root.getDirectoryHandle("cod4", { create: true });
        }

        async function getOPFSParent(root, path) {
            const parts = path.split("/");
            const filename = parts.pop();
            let directory = root;
            for (const part of parts) {
                if (!part) continue;
                directory = await directory.getDirectoryHandle(part, { create: true });
            }
            return { directory, filename };
        }

        async function writeStreamToOPFS(root, path, stream) {
            const parent = await getOPFSParent(root, path);
            const file = await parent.directory.getFileHandle(parent.filename, { create: true });
            const writable = await file.createWritable();
            try {
                await stream.pipeTo(writable);
            } catch (err) {
                try { await writable.abort(); } catch { }
                throw err;
            }
        }

        async function ensureOPFSDirectory(root, path) {
            const normalized = normalizeZipPath(path);
            if (!normalized) return root;
            let directory = root;
            for (const part of normalized.split("/")) {
                directory = await directory.getDirectoryHandle(part, { create: true });
            }
            return directory;
        }

        async function hasInstalledGame() {
            try {
                const root = await getOPFSRoot();
                const cod4 = await root.getDirectoryHandle("cod4");
                // Check if the cod4 folder exists and has at least 1 entry
                const iter = cod4.keys();
                const first = await iter.next();
                return !first.done;
            } catch {
                return false;
            }
        }

        const REQUIRED_ZONE_NAMES = new Set([
            "code_post_gfx", "code_post_gfx_mp", "code_pre_gfx", "code_pre_gfx_mp",
            "common", "common_mp", "ui", "ui_mp", "localized_code_post_gfx",
            "localized_code_post_gfx_mp", "localized_common", "localized_common_mp"
        ]);

        function isCampaignMapPath(lowerPath) {
            const match = lowerPath.match(/^zone\/[^/]+\/([^/]+)\.(ff|iwd)$/);
            if (!match) return false;
            const zoneName = match[1];
            if (REQUIRED_ZONE_NAMES.has(zoneName) || zoneName.startsWith("mp_")) return false;
            return true;
        }

        function shouldExtract(entry) {
            if (entry.directory) return false;
            const path = getGamePath(entry);
            if (!path || path.startsWith("__MACOSX/") || path.endsWith(".DS_Store")) return false;
            const lower = path.toLowerCase();
            if (!includeAudio.checked && (lower.endsWith(".mp3") || lower.endsWith(".wav") || lower.endsWith(".ogg"))) return false;
            if (!includeVideo.checked && (lower.endsWith(".bik") || lower.endsWith(".roq") || lower.endsWith(".mp4"))) return false;
            if (excludeCampaign.checked && isCampaignMapPath(lower)) return false;
            return true;
        }

        async function getCompressedDataPosition(zip, entry) {
            const header = await zip.read(entry.localOffset, 30);
            if (u32(header, 0) !== 0x04034b50) throw new Error("Invalid local ZIP header for " + entry.name);
            const nameLength = u16(header, 26);
            const extraLength = u16(header, 28);
            return entry.localOffset + 30 + nameLength + extraLength;
        }

        async function extractEntry(zip, root, entry) {
            const path = getGamePath(entry);
            if (!path) return;
            if (entry.directory) {
                await ensureOPFSDirectory(root, path);
                return;
            }
            const slash = path.lastIndexOf("/");
            if (slash >= 0) await ensureOPFSDirectory(root, path.slice(0, slash));

            const dataPosition = await getCompressedDataPosition(zip, entry);
            const compressed = await zip.stream(dataPosition, entry.compressedSize);
            let outputStream = compressed;
            if (entry.method === 8) {
                outputStream = compressed.pipeThrough(new DecompressionStream("deflate-raw"));
            }
            await writeStreamToOPFS(root, path, outputStream);
        }

        let installing = false;
        async function installGame() {
            if (installing) return;
            installing = true;
            installButton.disabled = true;
            playButton.disabled = true;
            wipeButton.disabled = true;
            installOptions.hidden = false;
            installLog.textContent = "";

            setProgress(0, "Preparing...");
            setDownloadUI("Preparing COD4 installation...", "");

            try {
                log("Preparing split ZIP...");
                log(`Archive parts: ${PART_COUNT}`);
                const zip = new SplitZipReader(PART_COUNT, PART_PREFIX);
                await zip.initialize();

                const entries = await readZipDirectory(zip);
                const files = entries.filter(shouldExtract);
                if (!files.length) throw new Error("No usable files were found in the ZIP.");

                let totalOutput = 0;
                for (const entry of files) totalOutput += entry.uncompressedSize;
                installCopySize.textContent = `${files.length.toLocaleString()} files selected • ${formatBytes(totalOutput)} extracted size`;
                log(`Files selected: ${files.length.toLocaleString()}`);
                log(`Extracted size: ${formatBytes(totalOutput)}`);

                log("Clearing old game data...");
                const root = await getFreshCod4Directory();

                let completedBytes = 0, completedFiles = 0;
                setDownloadUI("Installing game files...", "");

                for (const entry of files) {
                    const path = getGamePath(entry);
                    status("Extracting " + path);
                    setDownloadUI(`Extracting ${completedFiles + 1} / ${files.length}`, path);
                    await extractEntry(zip, root, entry);
                    completedBytes += entry.uncompressedSize;
                    completedFiles++;

                    const extractionProgress = totalOutput > 0 ? completedBytes / totalOutput : completedFiles / files.length;
                    setProgress(0.65 + extractionProgress * 0.35, `Extracting ${completedFiles.toLocaleString()} / ${files.length.toLocaleString()}`);

                    if (completedFiles % 16 === 0) {
                        await new Promise(r => setTimeout(r, 0));
                    }
                }

                localStorage.setItem("kisak_opfs_ready", "1");
                window.__kisakOpfsReady = true;

                setProgress(1, "Installation complete.");
                setDownloadUI("COD4 installation complete.", `${files.length.toLocaleString()} files extracted`);
                status("Game installed successfully.");
                log("\nInstallation complete.");
                playButton.disabled = false;
            } catch (err) {
                console.error(err);
                status("Installation failed.");
                log("\nERROR: " + (err.stack || err.message || err));
                installButton.disabled = false;
            } finally {
                wipeButton.disabled = false;
                installing = false;
            }
        }

        async function wipeGame() {
            if (!confirm("Delete all locally stored KisakCOD game data?")) return;
            try {
                const root = await getOPFSRoot();
                await root.removeEntry("cod4", { recursive: true });
                localStorage.removeItem("kisak_opfs_ready");
                window.__kisakOpfsReady = false;
                playButton.disabled = true;
                status("Game data deleted.");
                log("OPFS /cod4 deleted.");
            } catch (err) {
                console.error(err);
                status("Could not delete game data.");
            }
        }

        let gameScriptLoaded = false;

function loadGameScript() {
    if (gameScriptLoaded) return;
    gameScriptLoaded = true;

    log("Booting KisakCOD engine...");

    // 1. Tell Emscripten where to look for OPFS files
    Module.arguments = [
        "+set", "fs_basepath", "/cod4",
        "+set", "fs_homepath", "/cod4",
        "+set", "com_introplayed", "1"
    ];

    // 2. Dynamically create script tag with cache-buster to prevent 503/stale cache
    const script = document.createElement("script");
    script.async = true;
    script.src = "kisakcod-sp.js?t=" + Date.now();

    script.onload = () => {
        log("kisakcod-sp.js loaded successfully. Initializing WASM runtime...");
    };

    script.onerror = (e) => {
        log("CRITICAL ERROR: Failed to load kisakcod-sp.js! Check network tab or host.");
        console.error("Script load error:", e);
    };

    document.body.appendChild(script);
}

function playGame() {
    if (!window.__kisakOpfsReady) {
        status("The game files are not installed yet.");
        return;
    }

    installerPanel.style.display = "none";
    document.body.classList.add("game-running");
    resizeGameCanvas();

    try {
        canvas.focus({ preventScroll: true });
    } catch {
        try { canvas.focus(); } catch { }
    }

    loadGameScript();
}
        initializeInstaller();
    </script>
